
name: 01_01_02_24_hello_world

on:
  push:
    branches:
      - main

env:
  TASK_FOLDER: "${{ github.workspace }}"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Pull selenoid container
        run: |
          docker pull selenoid/vnc_chrome:128.0
          docker pull selenoid/video-recorder:latest-release

      - name: Run selenoid in Docker container
        run: docker compose up -d

      - name: Wait for container to start
        run: sleep 5

      - name: Wait selenoid status
        run: |
          timeout 30 bash -c 'until curl -fsS http://127.0.0.1:4444/status; do sleep 2; done'
          echo "Selenoid is ready!"

      - name: Build with Maven
        run: mvn test

      - name: Check video directory
        if: always()
        run: |
          echo "Video directory contents:"
          ls -lah ./video || true

      - name: Show Selenoid logs
        if: always()
        run: |
          docker compose logs --tail=50 || true

      # Wait until Selenoid finalizes the MP4 files
      - name: Prepare videos for upload
        id: prepare_video
        if: always()
        shell: bash
        run: |
          mkdir -p ./video ./video-ready

          for i in {1..30}; do
            echo "Checking finalized videos ($i/30)"

            find ./video -maxdepth 1 -type f \
              -name "*.mp4" \
              ! -name "selenoid*.mp4" \
              -size +1k \
              -exec cp -f {} ./video-ready/ \;

            if find ./video-ready -type f \
              -name "*.mp4" -size +1k | grep -q .; then
              echo "Finalized videos found!"
              ls -lah ./video-ready
              exit 0
            fi

            sleep 2
          done

          echo "::error::No finalized MP4 found!"
          ls -lah ./video
          exit 1

      - name: Uploading report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: ./target/surefire-reports/html

      - name: Uploading video
        if: ${{ always() && steps.prepare_video.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: ./video-ready/*.mp4
          if-no-files-found: error

      - name: Uploading logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: ./logs
